name: Deploy Website to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
    - name: Connect to VPS and deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        envs: ADMIN_PASSWORD
        script: |
          cd /home/timrekelj/nova-akademija
          git pull origin main
          docker compose exec -T nova-akademija npm run backup:events
          docker compose build
          docker compose run --rm nova-akademija npm run migrate:events
          docker compose run --rm nova-akademija npm run migrate:gallery
          docker compose down
          docker compose up -d
