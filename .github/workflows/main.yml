name: Deploy Website to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Connect to VPS and deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        envs: ADMIN_PASSWORD
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        script: |
          cd /home/timrekelj/nova-akademija
          git pull origin main
          docker compose exec -T nova-akademija sh -c 'mkdir -p /data/backups && cp /data/events.sqlite /data/backups/events-pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).sqlite'
          docker compose down
          docker compose up -d --build
