services:
  nova-akademija:
    build:
      context: .
      args:
        - VITE_WEB3FORMS_ACCESS_KEY=600f6776-ced9-416d-bd21-a6c5b66c8dec
    container_name: nova-akademija
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/data/events.sqlite
      - ADMIN_USERNAME=${ADMIN_USERNAME:-urban}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting the container}
    ports:
      - 4231:8080
    volumes:
      - nova-akademija-data:/data

volumes:
  nova-akademija-data:
