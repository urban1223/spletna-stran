services:
  nova-akademija:
    build:
      context: .
      args:
        - VITE_WEB3FORMS_ACCESS_KEY=600f6776-ced9-416d-bd21-a6c5b66c8dec
    container_name: nova-akademija
    restart: unless-stopped
    environment:
      - DATABASE_PATH=/data/events.sqlite
      - ADMIN_USERNAME=${ADMIN_USERNAME:-urban}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting the container}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - APP_ENCRYPTION_KEY=${APP_ENCRYPTION_KEY:-}
    ports:
      - 4231:8080
    volumes:
      - nova-akademija-data:/data

volumes:
  nova-akademija-data:
